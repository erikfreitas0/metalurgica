<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login de Cliente</title>
    <link rel="stylesheet" href="styles_cadastro.css">
</head>
<body>
    <div class="container">
        <h1>Login de Cliente</h1>
        <form id="loginForm" onsubmit="loginUsuario(event)">
            <div class="form-group">
                <label for="username">Username:</label>
                <input type="text" id="username" required>
            </div>
            <div class="form-group">
                <label for="senha">Senha:</label>
                <input type="password" id="senha" required>
            </div>
            <button type="submit">Login</button>
        </form>
        <p class="cliente-link">Não tem uma conta? <a href="cadastroUser.html">Cadastre-se aqui</a></p>
        <p class="cliente-link">É um vendedor? <a href="loginVendedor.html">Entre aqui</a></p>
    </div>

    <script>
       async function loginUsuario(event) {
    event.preventDefault();

    const login = document.getElementById("username").value;
    const senha = document.getElementById("senha").value;

    if (!login || !senha) {
        alert("Por favor, preencha todos os campos.");
        return;
    }

        try {
        const response = await fetch("http://localhost:3000/metalurgica/login", {
            method: "POST",
            headers: {
                "Content-Type": "application/json",
            },
            body: JSON.stringify({ login, senha }),
        });

        // Verifica o status da resposta
        if (response.ok) {
            const data = await response.json();
            alert(data.message);  // Mostra a mensagem de sucesso

            // Salva o ID do usuário no localStorage
            if (data.usuario_id) {  // Verifica se o backend retornou o `usuario_id`
                localStorage.setItem("usuario_id", data.usuario_id);
                console.log("ID do usuário salvo no localStorage:", data.usuario_id);
            } else {
                console.error("Nenhum ID de usuário retornado pelo servidor.");
            }

            // Redireciona para a página home
            window.location.href = "home.html";
        } else {
            const errorData = await response.json();
            alert(`Erro: ${errorData.error}`);
        }
    } catch (error) {
        console.error("Erro ao conectar com o servidor:", error);
        alert("Erro ao conectar com o servidor. Tente novamente.");
    }
}



    </script>
</body>
</html>
