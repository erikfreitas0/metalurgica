<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel Administrativo</title>
    <link rel="stylesheet" href="adm.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>Administração - Metalúrgica</h1>
        </header>
        <main>
            <div class="buttons">
                <button id="btnCotacoes">Cotações</button>
                <button id="btnMensagens">Mensagens</button>
            </div>
            <div id="content">
                <!-- Conteúdo dinâmico será exibido aqui -->
            </div>
        </main>
        <footer>
            <p>Metalúrgica © 2024</p>
        </footer>
    </div>

    <script>
        const API_COTACOES = 'http://localhost:3000/metalurgica/demandas'; // Ajuste para o endpoint correto
        const API_MENSAGENS = 'http://localhost:3000/metalurgica/mensagens'; // Ajuste para o endpoint correto

        const btnCotacoes = document.getElementById('btnCotacoes');
        const btnMensagens = document.getElementById('btnMensagens');
        const contentDiv = document.getElementById('content');

        // Função para buscar dados do backend
        async function fetchData(apiUrl) {
            try {
                const response = await fetch(apiUrl);
                if (!response.ok) throw new Error('Erro ao buscar dados');
                const data = await response.json();
                return data;
            } catch (error) {
                console.error(error);
                return [];
            }
        }

        // Exibe cotações no conteúdo
        btnCotacoes.addEventListener('click', async () => {
            contentDiv.innerHTML = '<h2>Cotações</h2>';
            const demandas = await fetchData(API_COTACOES);
            if (demandas.length === 0) {
                contentDiv.innerHTML += '<p>Nenhuma cotação encontrada.</p>';
            } else {
                demandas.forEach((demanda) => {
                    const container = document.createElement('div');
                    container.className = 'item';
                    container.innerHTML = `
                        <h3>Demanda: ${demanda.nomeProduto}</h3>
                        <p><strong>Quantidade:</strong> ${demanda.quantidade}</p>
                        <p><strong>Preço:</strong> R$ ${demanda.preco}</p>
                    `;
                    contentDiv.appendChild(container);
                });
            }
        });

        // Exibe mensagens no conteúdo
        btnMensagens.addEventListener('click', async () => {
            contentDiv.innerHTML = '<h2>Mensagens</h2>';
            const mensagens = await fetchData(API_MENSAGENS);
            if (mensagens.length === 0) {
                contentDiv.innerHTML += '<p>Nenhuma mensagem encontrada.</p>';
            } else {
                mensagens.forEach((mensagem) => {
                    const container = document.createElement('div');
                    container.className = 'item';
                    container.innerHTML = `
                        <h3>De: ${mensagem.remetente}</h3>
                        <p><strong>Assunto:</strong> ${mensagem.assunto}</p>
                        <p>${mensagem.conteudo}</p>
                    `;
                    contentDiv.appendChild(container);
                });
            }
        });
    </script>
</body>
</html>
