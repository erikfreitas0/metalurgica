<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel Administrativo</title>
    <link rel="stylesheet" href="styles_adm.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>Administração - Metalúrgica</h1>
        </header>
        <main>
            <div class="buttons">
                <button id="btnCotacoes">Cotações</button>
                <button id="btnMensagens">Mensagems</button>
            </div>
            <div id="content">
                <!-- Conteúdo dinâmico será exibido aqui -->
            </div>
            <div class="home-button-container">
                <a href="home.html" class="home-button">Voltar para Home</a>
            </div>
        </main>
    </div>

    <script>
        const API_COTACOES = 'http://localhost:3000/metalurgica/produto'; // Ajuste para o endpoint correto
        const API_MENSAGENS = 'http://localhost:3000/metalurgica/mensagem'; // Ajuste para o endpoint correto

        const btnCotacoes = document.getElementById('btnCotacoes');
        const btnMensagens = document.getElementById('btnMensagens');
        const contentDiv = document.getElementById('content');

        // Função para buscar dados do backend
        async function fetchData(apiUrl) {
    try {
        const response = await fetch(apiUrl);
        const data = await response.json();
        console.log('Dados recebidos da API:', data); // Exibe a resposta no console
        return data;
    } catch (error) {
        console.error('Erro ao buscar dados:', error);
        return [];
    }
}


        // Exibe cotações no conteúdo
        btnCotacoes.addEventListener('click', async () => {
    contentDiv.innerHTML = '<h2>Cotações</h2>';
    const data = await fetchData(API_COTACOES);

    // Valide o formato recebido
    const produto = Array.isArray(data) ? data : data.produtos || []; // Ajuste conforme o formato real

    if (produto.length === 0) {
        contentDiv.innerHTML += '<p>Nenhuma cotação encontrada.</p>';
    } else {
        produto.forEach((item) => {
            const container = document.createElement('div');
            container.className = 'item';
            container.innerHTML = `
                <h3>Demanda: ${item.codigo}</h3>
                <p><strong>Tipo:</strong> ${item.tipo}</p>
                <p><strong>Peso:</strong> ${item.peso}</p>
                <p><strong>Espessura:</strong> ${item.espessura}</p>
                <p><strong>Preço:</strong> R$ ${item.preco}</p>
            `;
            contentDiv.appendChild(container);
        });
    }
});




        // Exibe mensagems no conteúdo
        btnMensagens.addEventListener('click', async () => {
            contentDiv.innerHTML = '<h2>Mensagems</h2>';
            const mensagems = await fetchData(API_MENSAGENS);
            if (mensagems.length === 0) {
                contentDiv.innerHTML += '<p>Nenhuma mensagem encontrada.</p>';
            } else {
                mensagems.forEach((mensagem) => {
                    const container = document.createElement('div');
                    container.className = 'item';
                    container.innerHTML = `
                        <h3>De: ${mensagem.nome}</h3>
                        <p><strong>E-mail:</strong> ${mensagem.email}</p>
                        <p><strong>Telefone:</strong> ${mensagem.telefone}</p>
                        <p>${mensagem.mensagem}</p>
                    `;
                    contentDiv.appendChild(container);
                });
            }
        });
    </script>
</body>
</html>
