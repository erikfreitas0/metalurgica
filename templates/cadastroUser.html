<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro de Cliente</title>
    <link rel="stylesheet" href="styles_cadastro.css">
</head>
<body>
    <div class="container">
        <h1>Cadastro de Cliente</h1>
        <form>
            <div class="form-group">
                <label for="nome">Nome:</label>
                <input type="text" id="nome" required>
            </div>
            <div class="form-group">
                <label for="cpf">CPF:</label>
                <input type="text" id="cpf" maxlength="14" required>
            </div>
            <div class="form-group">
                <label for="email">Email:</label>
                <input type="email" id="email" required>
            </div>
            <div class="form-group">
                <label for="telefone">Telefone:</label>
                <input type="tel" id="telefone" maxlength="15" required>
            </div>
            <div class="form-group">
                <label for="login">Login:</label>
                <input type="text" id="login" required>
            </div>
            <div class="form-group">
                <label for="senha">Senha:</label>
                <input type="password" id="senha" required>
            </div>
            <button type="submit">Cadastrar</button>
        </form>
        <p class="login-user">Já possui um cadastro? <a href="loginUser.html"> Faça seu Login aqui</a></p>
        <p class="vendedor-link">Você é um vendedor? <a href="cadastroVendedor.html">Cadastre-se aqui</a></p>
    </div>

    <script>
        // Função para formatar CPF
        function formatarCPF(cpf) {
            cpf = cpf.replace(/\D/g, ""); // Remove caracteres não numéricos
            cpf = cpf.replace(/(\d{3})(\d)/, "$1.$2");
            cpf = cpf.replace(/(\d{3})(\d)/, "$1.$2");
            cpf = cpf.replace(/(\d{3})(\d{1,2})$/, "$1-$2");
            return cpf;
        }

        // Função para formatar Telefone
        function formatarTelefone(telefone) {
            telefone = telefone.replace(/\D/g, ""); // Remove caracteres não numéricos
            telefone = telefone.replace(/^(\d{2})(\d)/g, "($1) $2");
            telefone = telefone.replace(/(\d{4,5})(\d{4})$/, "$1-$2");
            return telefone;
        }

        // Event listener para CPF
        const cpfInput = document.getElementById("cpf");
        cpfInput.addEventListener("input", (e) => {
            e.target.value = formatarCPF(e.target.value);
        });

        // Event listener para Telefone
        const telefoneInput = document.getElementById("telefone");
        telefoneInput.addEventListener("input", (e) => {
            e.target.value = formatarTelefone(e.target.value);
        });

        document.addEventListener('DOMContentLoaded', () => {
    const form = document.querySelector('form');

    form.addEventListener('submit', async (event) => {
        event.preventDefault();

        // Captura os dados do formulário
        const nome = document.getElementById('nome').value;
        const cpf = document.getElementById('cpf').value;
        const email = document.getElementById('email').value;
        const telefone = document.getElementById('telefone').value;
        const login = document.getElementById('login').value;
        const senha = document.getElementById('senha').value;

        const API_URL = 'http://localhost:3000/metalurgica/usuario'; // Ajuste para o endpoint correto da sua API

        try {
            // Envia os dados para a API
            const response = await fetch(API_URL, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                },
                body: JSON.stringify({
                    nome,
                    cpf,
                    email,
                    telefone,
                    login,
                    senha,
                }),
            });

            // Trata a resposta da API
                        const responseText = await response.text(); // Lê a resposta como texto

            if (response.ok) {
                alert(responseText); // Exibe a mensagem retornada
            } else {
                alert(`Erro ao cadastrar usuário: ${responseText}`);
            }

        } catch (error) {
            console.error('Erro ao conectar com a API:', error);
            alert('Não foi possível cadastrar o usuário.');
        }
    });
});
    </script>
</body>
</html>
