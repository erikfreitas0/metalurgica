<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>Metalúrgica Favorit</title>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles_demandas.css">
</head>
<body>
    <header class="main-header">
        <div class="container">
            <div class="logo">
                <h1>Metalúrgica <span>Favorit</span></h1>
            </div>
            <nav class="main-nav">
                <ul>
                    <li><a href="home.html">Início</a></li>
                    <li><a href="demandas.html">Demandas</a></li>
                    <li><a href="informacoes.html">Sobre</a></li>
                    <li><a href="contato.html">Contato</a></li>
                </ul>
            </nav>
            <a href="loginUser.html" class="btn cta-btn">Faça já seu Login!</a>
        </div>
    </header>

    <section class="cotacao-section">
        <div class="container">
            <h2>Preencha os detalhes da cotação</h2>
            <form class="cotacao-form" id="cotacao-form">
                <!-- Tipo de Metal -->
                <div class="input-group">
                    <label for="tipo">Tipo de Metal</label>
                    <select id="tipo" name="tipo" required>
                        <option value="">Selecione</option>
                        <option value="ferro">Ferro</option>
                        <option value="alumínio">Alumínio</option>
                        <option value="cobre">Cobre</option>
                        <option value="aço inoxidável">Aço Inoxidável</option>
                    </select>
                </div>

                <!-- Peso -->
                <div class="input-group">
                    <label for="peso">Peso (kg)</label>
                    <input type="number" id="peso" name="peso" placeholder="Ex: 50.00" required>
                </div>

                <!-- Espessura -->
                <div class="input-group">
                    <label for="espessura">Espessura (mm)</label>
                    <input type="number" id="espessura" name="espessura" placeholder="Ex: 5.00" required>
                </div>

                <!-- Botão de Enviar -->
                <div class="input-group">
                    <button type="submit" class="submit-btn">Criar Cotação</button>
                </div>
            </form>
        </div>
    </section>

    <script>
       document.addEventListener('DOMContentLoaded', () => {
            const API_URL = 'http://localhost:3000/metalurgica/produto';

            document.getElementById('cotacao-form').addEventListener('submit', async (event) => {
                event.preventDefault();

                // Obter os elementos do formulário
                const tipoElement = document.getElementById('tipo');
                const pesoElement = document.getElementById('peso');
                const espessuraElement = document.getElementById('espessura');

                // Obter os valores
                const tipo = tipoElement.value;
                const peso = parseFloat(pesoElement.value); // Converter para número
                const espessura = parseFloat(espessuraElement.value); // Converter para número

                // Validar os valores
                if (isNaN(peso) || isNaN(espessura)) {
                    alert('Peso e Espessura devem ser números válidos.');
                    return;
                }

                // Obter o ID do usuário do localStorage
                const usuario_id = localStorage.getItem('usuario_id');

                if (!usuario_id) {
                    alert('Você precisa estar logado para criar uma cotação.');
                    return;
                }

                // Dados para envio (preço definido como null)
                const requestData = {
                    tipo: tipo,
                    peso: peso,
                    espessura: espessura,
                    preco: null, // Preço enviado como null
                    usuario_id: usuario_id
                };

                try {
                    const response = await fetch(API_URL, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(requestData)
                    });

                    if (response.ok) {
                        alert('Cotação criada com sucesso!');
                        document.getElementById('cotacao-form').reset(); // Limpa o formulário
                    } else {
                        const errorData = await response.json();
                        alert(`Erro ao criar a cotação: ${errorData.error || 'Erro desconhecido'}`);
                    }
                } catch (error) {
                    console.error('Erro:', error);
                    alert('Erro ao conectar ao servidor. Tente novamente mais tarde.');
                }
            });
       });
    </script>
</body>
</html>
