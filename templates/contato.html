<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>Metalúrgica Favorit</title>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles_contato.css">
</head>
<body>
    <header class="main-header">
        <div class="container">
            <div class="logo">
                <h1>Metalúrgica <span>Favorit</span></h1>
            </div>
            <nav class="main-nav">
                <ul>
                    <li><a href="home.html">Início</a></li>
                    <li><a href="demandas.html">Demandas</a></li>
                    <li><a href="informacoes.html">Sobre</a></li>
                    <li><a href="contato.html">Contato</a></li>
                </ul>
            </nav>
            <a href="demandas.html" class="btn cta-btn">Solicite um Orçamento</a>
        </div>
    </header>
    <section class="contato-section">
        <div class="container-contato">
            <h2>Fale Conosco</h2>

            <!-- Layout Horizontal: Fale Conosco + Abas -->
            <div class="top-section">
                <!-- Formulário de Contato -->
                <form class="contato-form" onsubmit="enviarMensagem(event)">
                    <div class="input-group">
                        <label for="nome">Nome Completo</label>
                        <input type="text" id="nome" name="nome" placeholder="Seu nome completo" required>
                    </div>
                    <div class="input-group">
                        <label for="email">E-mail</label>
                        <input type="email" id="email" name="email" placeholder="Seu e-mail" required>
                    </div>
                    <div class="input-group">
                        <label for="telefone">Telefone</label>
                        <input type="tel" id="telefone" name="telefone" placeholder="Seu telefone" required>
                    </div>
                    <div class="input-group">
                        <label for="mensagem">Mensagem</label>
                        <textarea id="mensagem" name="mensagem" rows="6" placeholder="Sua mensagem" required></textarea>
                    </div>
                    <button type="submit" class="btn cta-btn">Enviar</button>
                </form>
                

                <!-- Abas de Informações -->
                <div class="tabs-section">
                    <div class="tabs">
                        <button class="tab-btn active" data-target="#whatsapp">WhatsApp</button>
                        <button class="tab-btn" data-target="#instagram">Instagram</button>
                    </div>

                    <div class="tab-content">
                        <div id="whatsapp" class="tab-pane active">
                            <p><strong>WhatsApp:</strong> (11) 98765-4321</p>
                        </div>
                        <div id="instagram" class="tab-pane">
                            <p><strong>Instagram:</strong> <a href="https://www.instagram.com/suametalurgica" target="_blank">@suametalurgica</a></p>
                        </div>
                    </div>
                </div>
            </div>

            <script>
                const API_URL = 'http://localhost:3000/metalurgica/mensagens'; // Ajuste para o endpoint correto da sua API
            
                async function enviarMensagem(event) {
                    event.preventDefault(); // Previne o recarregamento da página ao enviar o formulário
            
                    // Captura os dados do formulário
                    const nome = document.getElementById('nome').value;
                    const email = document.getElementById('email').value;
                    const telefone = document.getElementById('telefone').value;
                    const mensagem = document.getElementById('mensagem').value;
            
                    try {
                        // Envia os dados para a API
                        const response = await fetch(API_URL, {
                            method: 'POST',
                            headers: {
                                'Content-Type': 'application/json',
                            },
                            body: JSON.stringify({
                                nome: nome,
                                email: email,
                                telefone: telefone,
                                mensagem: mensagem,
                            }),
                        });
            
                        // Verifica a resposta
                        const responseText = await response.text();
            
                        if (response.ok) {
                            alert('Mensagem enviada com sucesso!');
                            // Limpa os campos do formulário
                            document.querySelector('.contato-form').reset();
                        } else {
                            alert(`Erro ao enviar mensagem: ${responseText}`);
                        }
                    } catch (error) {
                        console.error('Erro ao conectar com a API:', error);
                        alert('Não foi possível enviar a mensagem.');
                    }
                }
            </script>
            
            <script>
                

                // Função para formatar Telefone
                function formatarTelefone(telefone) {
                    telefone = telefone.replace(/\D/g, ""); // Remove caracteres não numéricos
                    telefone = telefone.replace(/^(\d{2})(\d)/g, "($1) $2");
                    telefone = telefone.replace(/(\d{4,5})(\d{4})$/, "$1-$2");
                    return telefone;
                }
        
                // Event listener para Telefone
                const telefoneInput = document.getElementById("telefone");
                telefoneInput.addEventListener("input", (e) => {
                    e.target.value = formatarTelefone(e.target.value);
                });
            </script>
</body>
</html>
